name: Import FSGT

# Quand un programme FSGT (PDF) est déposé dans le CMS (menu « Import FSGT »), ses activités sont
# créées dans le calendrier et un compte rendu est écrit dans la fiche de l'import.
# Voir scripts/importer-fsgt.mjs.
on:
  push:
    branches: [main]
    paths: ['src/content/imports-fsgt/**']
  workflow_dispatch: # bouton « Run workflow » dans l'onglet Actions

permissions:
  contents: write # pour enregistrer les activités créées
  actions: write # pour relancer la mise en ligne

concurrency:
  group: import-fsgt
  cancel-in-progress: false

jobs:
  importer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lire les programmes FSGT à traiter
        run: node scripts/importer-fsgt.mjs
      - name: Enregistrer et remettre le site en ligne
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain src/content)" ]; then
            echo "Rien à enregistrer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/content/sorties src/content/imports-fsgt
          git commit -m "Import FSGT : lecture du programme ou création des activités validées"
          # Un rédacteur a pu publier entre-temps : on se met à jour avant d'envoyer
          for essai in 1 2 3; do
            git pull --rebase origin main && git push && break
            sleep 5
          done
          # Un commit fait par le robot ne déclenche pas les autres workflows : on relance la mise en ligne
          gh workflow run deploy.yml --ref main
