<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Administration · La Graverie Cyclos</title>
    <style>
      /* Bandeau d'état de la publication, affiché par-dessus le CMS */
      #etat-publication {
        position: fixed; right: 16px; bottom: 16px; z-index: 100000; max-width: min(440px, calc(100vw - 32px));
        font: 14px/1.45 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: #fff; color: #2a2522; border-radius: 12px; border-left: 6px solid #6b625b;
        box-shadow: 0 6px 24px rgb(0 0 0 / 25%); padding: 12px 40px 12px 14px;
      }
      #etat-publication[hidden] { display: none; }
      #etat-publication.attention { border-left-color: #f2c200; }
      #etat-publication.erreur { border-left-color: #b5121b; }
      #etat-publication.ok { border-left-color: #3f7a35; }
      #etat-publication strong { display: block; margin-bottom: 4px; }
      #etat-publication ul { margin: 6px 0 0; padding-left: 18px; }
      #etat-publication li { margin: 4px 0; }
      #etat-publication .detail { color: #6b625b; }
      #etat-publication a { color: #b5121b; }
      #etat-publication hr { border: 0; border-top: 1px solid #ddd; margin: 10px 0; }
      /* Lien permanent vers le site, en bas à gauche */
      #voir-le-site {
        position: fixed; left: 16px; bottom: 16px; z-index: 100000;
        font: 600 14px/1 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        padding: 10px 16px; border-radius: 999px; text-decoration: none;
        background: #b5121b; color: #fff; box-shadow: 0 4px 14px rgb(0 0 0 / 25%);
      }
      #voir-le-site:hover { background: #8f0e15; }
      #etat-publication button {
        position: absolute; top: 6px; right: 8px; border: 0; background: none; cursor: pointer;
        font-size: 20px; line-height: 1; color: #6b625b;
      }
    </style>
  </head>
  <body>
    <a id="voir-le-site" href="../">← Voir le site</a>
    <div id="etat-publication" role="status" aria-live="polite" hidden></div>

    <script>
      // Bandeau d'état de la publication :
      // - mise en ligne et import FSGT en cours / échoués (API publique de GitHub, derniers passages des workflows) ;
      // - contenus écartés car invalides et comptes rendus des imports FSGT récents
      //   (rapport /etat-publication.json produit à chaque mise en ligne).
      (() => {
        const bandeau = document.getElementById('etat-publication');
        let ferme = false;
        let etaitEnCours = false;
        const echapper = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
        // Comptes rendus d'import déjà lus (bandeau fermé) : on ne les réaffiche pas
        const importsVus = () => {
          try {
            return JSON.parse(localStorage.getItem('imports-vus') ?? '[]');
          } catch {
            return [];
          }
        };

        function afficher(classe, html, auFermer) {
          if (ferme) return;
          bandeau.className = classe;
          bandeau.innerHTML = `${html}<button type="button" aria-label="Fermer">×</button>`;
          bandeau.querySelector('button').onclick = () => {
            ferme = true;
            bandeau.hidden = true;
            auFermer?.();
          };
          bandeau.hidden = false;
        }

        async function verifier() {
          // Dépôt GitHub lu dans la configuration du CMS (backend.repo)
          const config = await fetch('config.yml', { cache: 'no-store' }).then((r) => r.text());
          const depot = config.match(/^\s*repo:\s*(\S+)/m)?.[1];

          // Un seul appel pour tous les workflows (l'API de GitHub limite à 60 requêtes par heure)
          let passages = [];
          try {
            const reponse = await fetch(`https://api.github.com/repos/${depot}/actions/runs?branch=main&per_page=10`);
            if (reponse.ok) passages = (await reponse.json()).workflow_runs ?? [];
          } catch {
            // GitHub injoignable ou limite de requêtes atteinte : on se contente du rapport
          }
          const dernier = (workflow) => passages.find((p) => p.path?.endsWith(workflow));
          const passage = dernier('deploy.yml');
          const passageImport = dernier('importer-fsgt.yml');
          let rapport;
          try {
            rapport = await fetch(`../etat-publication.json?t=${Date.now()}`, { cache: 'no-store' }).then((r) => (r.ok ? r.json() : undefined));
          } catch {}

          if (passageImport && passageImport.status !== 'completed') {
            etaitEnCours = true;
            return afficher('attention', "<strong>⏳ Lecture du programme FSGT en cours…</strong><span class=\"detail\">Les activités seront créées dans le Calendrier d'ici une à deux minutes, puis mises en ligne.</span>");
          }
          if (passage && passage.status !== 'completed') {
            etaitEnCours = true;
            return afficher('attention', '<strong>⏳ Mise en ligne en cours…</strong><span class="detail">Vos dernières modifications apparaîtront sur le site dans une à deux minutes.</span>');
          }
          for (const [p, quoi] of [[passage, 'La dernière mise en ligne'], [passageImport, 'La lecture du programme FSGT']]) {
            if (p?.conclusion !== 'failure') continue;
            return afficher(
              'erreur',
              `<strong>❌ ${quoi} a échoué</strong>
               <span class="detail">${p === passage ? 'Le site reste dans sa version précédente. ' : ''}Il s'agit d'un problème technique : prévenez le responsable du site.</span>
               <br><a href="${echapper(p.html_url)}" target="_blank" rel="noopener">Voir le détail sur GitHub</a>`,
            );
          }

          const blocs = [];
          let classe = 'ok';
          const problemes = rapport?.problemes ?? [];
          if (problemes.length) {
            classe = 'erreur';
            const liste = problemes
              .map((p) => `<li><b>${echapper(p.menu)} › ${echapper(p.titre || p.id)}</b><br><span class="detail">${echapper(p.message)}</span></li>`)
              .join('');
            blocs.push(
              `<strong>⚠️ ${problemes.length} contenu${problemes.length > 1 ? 's ne sont' : " n'est"} pas publié${problemes.length > 1 ? 's' : ''}</strong>
               <span class="detail">Le reste du site est bien en ligne. Ouvrez ${problemes.length > 1 ? 'ces fiches' : 'cette fiche'} dans le CMS pour corriger :</span>
               <ul>${liste}</ul>`,
            );
          }
          // Imports FSGT récents ou en attente : résumé, le détail est dans la fiche de l'import
          const cle = (i) => `${i.id}|${i.traiteLe}`;
          const imports = (rapport?.imports ?? []).filter((i) => !importsVus().includes(cle(i)));
          if (imports.length) {
            const etats = {
              'a-traiter': ['⏳', () => 'en attente de lecture'],
              'a-valider': ['📝', (i) => `<b>à vérifier puis valider</b> (${echapper(i.resume)})`],
              valide: ['⏳', () => 'création des activités en attente'],
              termine: ['✅', (i) => echapper(i.resume)],
              echec: ['❌', (i) => echapper(i.resume)],
            };
            if (classe !== 'erreur') {
              classe = imports.some((i) => i.statut === 'echec') ? 'erreur' : imports.some((i) => i.statut !== 'termine') ? 'attention' : 'ok';
            }
            const liste = imports
              .map((i) => {
                const [icone, texte] = etats[i.statut] ?? ['', () => ''];
                return `<li>${icone} <b>${echapper(i.titre)}</b> : ${texte(i)}</li>`;
              })
              .join('');
            blocs.push(
              `<strong>📄 Import FSGT</strong><ul>${liste}</ul>
               <span class="detail">Détail et validation : menu <b>Import FSGT</b>, ouvrez l'import (faites d'abord F5 pour voir sa dernière version).</span>`,
            );
          }
          if (blocs.length) {
            // Fermer le bandeau = comptes rendus d'import lus
            const marquerLus = () => {
              try {
                const lus = imports.filter((i) => i.statut === 'termine' || i.statut === 'echec').map(cle);
                localStorage.setItem('imports-vus', JSON.stringify([...importsVus(), ...lus].slice(-50)));
              } catch {}
            };
            return afficher(classe, blocs.join('<hr>'), marquerLus);
          }
          if (etaitEnCours) {
            etaitEnCours = false;
            return afficher('ok', '<strong>✅ Mise en ligne terminée</strong><span class="detail">Rechargez le site pour voir vos modifications (Ctrl + F5).</span>');
          }
          bandeau.hidden = true;
        }

        // Nouvelle vérification toutes les 20 s pendant une mise en ligne, toutes les 2 min sinon
        // (l'API de GitHub limite à 60 requêtes par heure)
        async function boucle() {
          if (document.visibilityState === 'visible') await verifier().catch(() => {});
          setTimeout(boucle, etaitEnCours ? 20000 : 120000);
        }
        boucle();
        // Onglet ouvert en arrière-plan puis affiché : on vérifie tout de suite
        document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && verifier().catch(() => {}));
      })();
    </script>

    <!-- Sveltia CMS : la configuration est lue dans config.yml (même dossier).
         Version figée pour éviter qu'une mise à jour casse l'interface du jour au lendemain.
         Pour mettre à jour : voir docs/GUIDE-TECHNIQUE.md, section « Mettre à jour Sveltia CMS ». -->
    <script src="https://unpkg.com/@sveltia/cms@0.250.2/dist/sveltia-cms.js"></script>
  </body>
</html>
