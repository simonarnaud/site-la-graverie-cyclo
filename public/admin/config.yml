# Configuration de Sveltia CMS (https://sveltiacms.app/en/docs).
# Toute modification de champ doit être répercutée dans src/content.config.ts (et inversement).

backend:
  name: github
  repo: simonarnaud/site-la-graverie-cyclo
  branch: main
  # Bouton « Se connecter avec GitHub » : passe par le relais sveltia-cms-auth (Cloudflare Workers,
  # repo simonarnaud/sveltia-cms-auth). La connexion par jeton reste possible en secours.
  base_url: https://sveltia-cms-auth.sim-arnaud.workers.dev

site_url: https://simonarnaud.github.io/site-la-graverie-cyclo/
display_url: https://simonarnaud.github.io/site-la-graverie-cyclo/

# Dossier par défaut (peu utilisé : les images sont rangées à côté de chaque contenu).
media_folder: /public/uploads
public_folder: /uploads

# Noms de fichiers et d'adresses sans accents ni espaces (« Période 2026.pdf » → « periode-2026.pdf »)
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'

# Les photos sont réduites et converties en WebP dans le navigateur, avant l'envoi.
media_libraries:
  all:
    slugify_filename: true
    transformations:
      raster_image:
        format: webp
        quality: 85
        width: 2048
        height: 2048

collections:
  - name: sorties
    label: Calendrier
    label_singular: Événement
    description: Entraînements (sorties du club), randos FSGT, courses… Les événements passés restent consultables en remontant les mois du calendrier.
    folder: src/content/sorties
    # Un dossier par événement : son image est supprimée avec lui
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    create: true
    identifier_field: titre
    slug: "{{fields.date | date('YYYY-MM-DD')}}-{{slug}}"
    summary: "{{date | date('DD/MM/YYYY')}} – {{categorie}} – {{titre}}{{gpx | default('{{parcours}}') | ternary(' – 🗺️ GPX', ' – sans GPX')}}"
    sortable_fields: [date, titre, categorie]
    fields:
      - { name: titre, label: Titre, widget: string }
      # Valeurs à garder synchronisées avec src/lib/categories.ts
      - name: categorie
        label: Type
        widget: select
        default: entrainement
        options:
          - { label: Entraînement, value: entrainement }
          - { label: Rando FSGT, value: rando }
          - { label: Course, value: course }
          - { label: Réunion (réunion du club, assemblée générale…), value: reunion }
          - { label: Autre, value: autre }
      # Valeurs à garder synchronisées avec src/lib/categories.ts
      - name: discipline
        label: Discipline
        widget: select
        required: false
        options:
          - { label: Cyclo, value: cyclo }
          - { label: VTT, value: vtt }
          - { label: Gravel, value: gravel }
      - { name: date, label: Date et heure de départ, widget: datetime, input_timezone: Europe/Paris }
      - { name: lieuRdv, label: Lieu / rendez-vous, widget: string }
      - name: pointDepart
        label: Point de départ sur la carte
        hint: "Facultatif. Cherchez l'adresse ou cliquez sur la carte à l'endroit exact du départ : la page de l'activité proposera de l'ouvrir dans Google Maps."
        widget: map
        type: Point
        decimals: 6
        center: [-0.894, 48.885]
        zoom: 12
        required: false
      - name: organisateur
        label: Organisateur
        hint: À remplir si ce n'est pas le club (club voisin, FSGT…).
        widget: string
        required: false
      - name: parcours
        label: Parcours d'entraînement (entraînements)
        hint: Pour un entraînement, choisissez l'un des parcours habituels du club.
        widget: relation
        collection: parcours
        value_field: '{{slug}}'
        search_fields: [titre]
        display_fields: [titre]
        required: false
      - name: gpx
        label: Trace GPX (rando, course…)
        hint: "Pour une rando ou une course, déposez directement son fichier GPX ici : inutile de créer un parcours. Coupez le début et la fin de la trace s'ils passent devant un domicile."
        widget: file
        accept: .gpx
        required: false
      - name: openrunner
        label: Numéro du circuit OpenRunner
        hint: "Facultatif. Le numéro est à la fin de l'adresse du circuit sur OpenRunner."
        widget: string
        required: false
        pattern: ['^[0-9]*$', 'Uniquement des chiffres']
      - name: lienStrava
        label: Lien de l'événement Strava
        hint: "Créez d'abord l'événement dans le club Strava, puis collez son lien ici (Partager → Copier le lien). Les membres indiquent leur participation sur Strava."
        widget: string
        required: false
      - name: lienInscription
        label: Lien d'inscription chez l'organisateur
        hint: Seulement pour une rando ou une course organisée ailleurs, si l'organisateur demande une inscription (HelloAsso, site de la FSGT…).
        widget: string
        required: false
      - { name: annulee, label: Événement annulé, widget: boolean, default: false }
      - { name: couverture, label: Image d'illustration (facultatif), widget: image, required: false }
      - { name: couvertureAlt, label: Description de l'image (pour les malvoyants), widget: string, required: false }
      - { name: body, label: Description, widget: markdown, required: false, editor_components: [] }

  - name: actualites
    label: Actualités
    label_singular: Actualité
    folder: src/content/actualites
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    create: true
    identifier_field: titre
    summary: "{{date | date('DD/MM/YYYY')}} – {{titre}}"
    sortable_fields: [date, titre]
    fields:
      - { name: titre, label: Titre, widget: string }
      - { name: date, label: Date, widget: datetime, input_timezone: Europe/Paris }
      - { name: auteur, label: Auteur, widget: string }
      - { name: resume, label: Résumé (une phrase), widget: string, required: false }
      - { name: couverture, label: Image de couverture, widget: image, required: false }
      - { name: couvertureAlt, label: Description de l'image (pour les malvoyants), widget: string, required: false }
      - { name: brouillon, label: Brouillon (non publié), widget: boolean, default: false }
      - { name: body, label: Texte, widget: markdown }

  - name: parcours
    label: Parcours d'entraînement
    label_singular: Parcours
    description: Les parcours habituels des entraînements du club. Pour une rando ou une course, déposez plutôt le GPX directement dans l'événement du calendrier.
    folder: src/content/parcours
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    create: true
    identifier_field: titre
    fields:
      - { name: titre, label: Titre, widget: string }
      # Valeurs à garder synchronisées avec src/lib/categories.ts
      - name: discipline
        label: Discipline
        widget: select
        options:
          - { label: Cyclo, value: cyclo }
          - { label: VTT, value: vtt }
          - { label: Gravel, value: gravel }
      - name: gpx
        label: Trace GPX
        hint: Coupez le début et la fin de la trace pour ne pas révéler le domicile de quelqu'un.
        widget: file
        accept: .gpx
      - { name: distanceKm, label: Distance (km), hint: Laisser vide pour la calculer depuis le GPX., widget: number, value_type: float, required: false }
      - { name: deniveleM, label: Dénivelé positif (m), hint: Laisser vide pour le calculer depuis le GPX., widget: number, value_type: int, required: false }
      - { name: couverture, label: Photo, widget: image, required: false }
      - { name: couvertureAlt, label: Description de la photo, widget: string, required: false }
      - { name: body, label: Description, widget: markdown, required: false }

  - name: albums
    label: Photos
    label_singular: Album
    description: Une sélection de 12 photos maximum par sortie. L'album complet reste sur Google Photos (ou autre).
    folder: src/content/albums
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    create: true
    identifier_field: titre
    summary: "{{date | date('DD/MM/YYYY')}} – {{titre}}"
    fields:
      - { name: titre, label: Titre, widget: string }
      - { name: date, label: Date, widget: datetime, input_timezone: Europe/Paris }
      - { name: lienAlbumComplet, label: Lien vers l'album complet, widget: string }
      - name: photos
        label: Photos (12 maximum)
        hint: Au bout de 12 mois, les photos de l'album sont retirées automatiquement du site pour gagner de la place. L'album reste listé avec son lien vers l'album complet.
        widget: list
        required: false
        max: 12
        fields:
          - { name: src, label: Photo, widget: image }
          - { name: alt, label: Description courte, widget: string, required: false }
      # Renseigné par l'archivage automatique mensuel (albums de plus de 12 mois)
      - { name: archive, label: Album archivé, widget: hidden, default: false }

  - name: documents
    label: Documents
    label_singular: Document
    description: Fichiers PDF à télécharger (programme FSGT, règlements, comptes rendus). 10 Mo maximum par fichier.
    folder: src/content/documents
    # Un dossier par document : le PDF est supprimé avec lui
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    create: true
    identifier_field: titre
    summary: "{{date | date('DD/MM/YYYY')}} – {{titre}}"
    sortable_fields: [date, titre]
    view_groups:
      - { label: Section, field: section }
    fields:
      - { name: titre, label: Titre, widget: string }
      - { name: date, label: Date de publication, widget: datetime, type: date }
      # Valeurs à garder synchronisées avec SECTIONS_DOCUMENTS (src/lib/categories.ts)
      - name: section
        label: Section
        widget: select
        default: autre
        options:
          - { label: Calendriers FSGT, value: calendrier-fsgt }
          - { label: Comptes rendus d'AG, value: compte-rendu-ag }
          - { label: Règlements et statuts, value: reglement }
          - { label: Adhésion et licences, value: adhesion }
          - { label: Inscriptions, value: inscription }
          - { label: Autres documents, value: autre }
      - name: fichier
        label: Fichier PDF
        widget: file
        accept: application/pdf,.pdf
        media_libraries:
          default:
            config:
              max_file_size: 10485760 # 10 Mo
      - { name: description, label: Description courte, widget: string, required: false }

  - name: partenaires
    label: Partenaires
    label_singular: Partenaire
    description: "Les partenaires du club : leur logo s'affiche sur la page Partenaires et renvoie vers leur site. Le texte d'introduction se modifie dans « Le club › Page Partenaires »."
    folder: src/content/partenaires
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    create: true
    identifier_field: nom
    summary: '{{nom}}'
    sortable_fields: [nom, ordre]
    fields:
      - { name: nom, label: Nom du partenaire, widget: string }
      - name: logo
        label: Logo
        hint: De préférence un logo sur fond transparent ou blanc (PNG, SVG converti, JPG…).
        widget: image
      - { name: site, label: Site internet du partenaire, hint: "Adresse complète, par exemple https://www.exemple.fr", widget: string }
      - { name: ordre, label: Ordre d'affichage (facultatif), hint: Le plus petit numéro s'affiche en premier. Laisser vide pour l'ordre alphabétique., widget: number, value_type: int, required: false }

  - name: club
    label: Le club
    files:
      - name: le-club
        label: Page de présentation
        file: src/content/pages/le-club.md
        fields:
          - { name: titre, label: Titre, widget: string }
          - { name: description, label: Description, widget: string, required: false }
          - { name: body, label: Texte, widget: markdown, editor_components: [] }
      - name: infos
        label: Coordonnées et bureau
        file: src/data/club.json
        fields:
          - { name: nom, label: Nom du club, widget: string }
          - { name: devise, label: Devise (titre de la page d'accueil), widget: string, required: false }
          - { name: slogan, label: Slogan, widget: string }
          - { name: email, label: Email de contact, widget: string }
          - { name: ville, label: Ville, widget: string }
          - { name: lienAdhesion, label: Lien d'adhésion HelloAsso, widget: string, required: false }
          - name: goatcounter
            label: Code GoatCounter (statistiques de visite)
            hint: "Le mot avant .goatcounter.com dans l'adresse du compte GoatCounter du club. Laisser vide pour désactiver les statistiques."
            widget: string
            required: false
            pattern: ['^[a-z0-9-]*$', 'Uniquement des minuscules, chiffres et tirets']
          - name: reseaux
            label: Réseaux sociaux
            widget: list
            fields:
              - { name: nom, label: Nom, widget: string }
              - { name: url, label: Lien, widget: string }
          - name: bureau
            label: Bureau
            hint: Uniquement avec l'accord des personnes.
            widget: list
            fields:
              - { name: role, label: Rôle, widget: string }
              - { name: nom, label: Nom, widget: string }
      - name: partenaires
        label: Page Partenaires (texte d'introduction)
        file: src/content/pages/partenaires.md
        fields:
          - { name: titre, label: Titre, widget: string }
          - { name: description, label: Description courte (moteurs de recherche), widget: string, required: false }
          - { name: body, label: Texte de soutien, widget: markdown }
      - name: mentions-legales
        label: Mentions légales
        file: src/content/pages/mentions-legales.md
        fields:
          - { name: titre, label: Titre, widget: string }
          - { name: body, label: Texte, widget: markdown, editor_components: [] }
      - name: confidentialite
        label: Politique de confidentialité
        file: src/content/pages/confidentialite.md
        fields:
          - { name: titre, label: Titre, widget: string }
          - { name: body, label: Texte, widget: markdown, editor_components: [] }
